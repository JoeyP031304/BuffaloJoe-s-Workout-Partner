function profileCard(){ const p=S.profile||{}; const cal=profileCalories(); const hUnit= S.units==='kg'?'cm':'in';
  return `<div class="card"><h2 style="margin-bottom:4px">Profile</h2><p class="small muted" style="margin-bottom:10px">Adjusts the strength-score standards and estimates your daily calories. Stays on this device.</p><div class="stack">
   <label class="row between">Biological sex<select id="pf-sex" style="width:140px"><option value="" ${!p.sex?'selected':''}>Not set</option><option value="male" ${p.sex==='male'?'selected':''}>Male</option><option value="female" ${p.sex==='female'?'selected':''}>Female</option></select></label>
   <label class="row between">Age<input id="pf-age" type="number" inputmode="numeric" style="width:140px" value="${S.birthdate?(ageFromBirthdate(S.birthdate)??''):(p.age||'')}" ${S.birthdate?'readonly title="From your date of birth"':''}></label>
   <label class="row between">Height (${hUnit})<input id="pf-height" type="number" inputmode="decimal" step="any" style="width:140px" value="${p.height||''}" placeholder="${S.units==='kg'?'e.g. 178':'e.g. 70'}"></label>
   <label class="row between">Weight (${S.units})<input id="set-bw" type="number" inputmode="decimal" step="any" style="width:140px" value="${S.bodyweight||latestBodyweight()||''}"></label>
   ${cal? `<div class="grid2" style="margin-top:4px"><div class="stat"><div class="lbl">Daily calories for ${ {strength:'strength',hypertrophy:'muscle gain',fatloss:'fat loss',endurance:'endurance'}[S.goal] }</div><div class="num">${cal.target.toLocaleString()}</div><div class="tiny muted">maintenance ≈ ${cal.tdee.toLocaleString()}</div></div><div class="stat"><div class="lbl">Protein target</div><div class="num">${cal.protein} g</div><div class="tiny muted">BMI ${cal.bmi}</div></div></div><p class="tiny muted">Mifflin-St Jeor estimate using your plan's training days. Adjust by how your weight actually trends.</p>` : '<p class="tiny muted">Fill in all four to see calorie and protein estimates.</p>'}
  </div></div>`; }

/* ---------- Sheets (modals) ---------- */
function openSheet(html){ closeSheet(); const bg=document.createElement('div'); bg.className='sheet-bg'; bg.id='sheet'; bg.innerHTML=`<div class="sheet">${html}</div>`; document.body.appendChild(bg); bg.addEventListener('click',e=>{ if(e.target===bg) closeSheet(); }); }
function closeSheet(){ const s=document.getElementById('sheet'); if(s) s.remove(); }
function exercisePicker(onPick, opts={}){ let q='',musc='',eq=''; const draw=()=>{ const list=exercises().filter(e=>(!q||e.name.toLowerCase().includes(q))&&(!musc||e.primary.includes(musc))&&(!eq||e.equipment===eq)); const el=document.getElementById('picker-list'); if(el) el.innerHTML=list.map(e=>`<li data-pick="${e.id}"><div class="grow"><div class="t">${esc(e.name)}</div><div class="s">${e.primary.map(m=>MUSCLE_LABEL[m]).join(', ')} · ${e.equipment}</div></div>${opts.history?`<button class="btn ghost sm" data-ex-hist="${e.id}">Stats</button>`:''}</li>`).join('')||'<li class="muted">No matches</li>'; };
  openSheet(`<h2>${opts.title||'Add exercise'}</h2><input class="search" id="picker-q" placeholder="Search exercises"><div class="chips" style="margin-bottom:8px"><button class="chip on" data-m="">All muscles</button>${MUSCLES.map(m=>`<button class="chip" data-m="${m}">${MUSCLE_LABEL[m]}</button>`).join('')}</div><div class="chips" style="margin-bottom:10px"><button class="chip on" data-q="">Any equipment</button>${EQUIPMENT.map(q=>`<button class="chip" data-q="${q}">${q}</button>`).join('')}</div><ul class="list" id="picker-list"></ul><button class="btn quiet wide" style="margin-top:10px" id="picker-custom">+ Create custom exercise</button>`);
  draw(); const sh=document.getElementById('sheet');
  sh.querySelector('#picker-q').addEventListener('input',e=>{ q=e.target.value.toLowerCase(); draw(); });
  sh.addEventListener('click',e=>{ const m=e.target.closest('[data-m]'); if(m){ musc=m.dataset.m; sh.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===m)); draw(); return; } const qq=e.target.closest('[data-q]'); if(qq){ eq=qq.dataset.q; sh.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('on',x===qq)); draw(); return; } const h=e.target.closest('[data-ex-hist]'); if(h){ showExerciseStats(h.dataset.exHist); return; } const li=e.target.closest('[data-pick]'); if(li){ onPick(li.dataset.pick); } if(e.target.id==='picker-custom') customExerciseForm(onPick); }); }
function customExerciseForm(onPick){ openSheet(`<h2>Custom exercise</h2><div class="stack"><input id="cx-name" placeholder="Name"><div><div class="small" style="margin-bottom:6px">Primary muscles</div><div class="chips" id="cx-m">${MUSCLES.map(m=>`<button class="chip" data-m="${m}">${MUSCLE_LABEL[m]}</button>`).join('')}</div></div><label>Equipment<select id="cx-eq">${EQUIPMENT.map(q=>`<option>${q}</option>`).join('')}</select></label><label>Type<select id="cx-kind">${Object.entries(KIND_LABEL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><button class="btn primary wide" id="cx-save">Save exercise</button></div>`);
  const sh=document.getElementById('sheet'); const sel=new Set(); sh.addEventListener('click',e=>{ const m=e.target.closest('[data-m]'); if(m){ const k=m.dataset.m; sel.has(k)?sel.delete(k):sel.add(k); m.classList.toggle('on'); return; } if(e.target.id==='cx-save'){ const name=sh.querySelector('#cx-name').value.trim(); if(!name) return toast('Give it a name'); if(!sel.size) return toast('Pick at least one muscle'); const ex={id:'cx_'+uid(),name,primary:[...sel],secondary:[],equipment:sh.querySelector('#cx-eq').value,kind:sh.querySelector('#cx-kind').value,compound:sel.size>1,custom:true}; S.customExercises.push(ex); save(); toast('Saved'); if(onPick) onPick(ex.id); else closeSheet(); } }); }
function showExerciseStats(exId){ const e=exById(exId); const b=bestFor(exId); const hist=S.workouts.filter(w=>w.end&&w.exercises.some(x=>x.exId===exId)).sort((a,b)=>b.end-a.end).slice(0,8); openSheet(`<h2>${esc(e.name)}</h2><p class="small muted" style="margin-bottom:10px">${e.primary.map(m=>MUSCLE_LABEL[m]).join(', ')}${e.secondary.length?' · also '+e.secondary.map(m=>MUSCLE_LABEL[m]).join(', '):''} · ${e.equipment} · ${KIND_LABEL[e.kind]}</p>${b.bestE?`<div class="grid2" style="margin-bottom:10px"><div class="stat"><div class="lbl">Best e1RM</div><div class="num">${Math.round(b.bestE)} ${S.units}</div></div><div class="stat"><div class="lbl">Heaviest</div><div class="num">${b.bestW} ${S.units}</div></div></div>`:''}${exerciseChart(exId)}${hist.length?`<h3 style="margin:12px 0 4px">Recent</h3>${hist.map(w=>{ const ex=w.exercises.find(x=>x.exId===exId); return `<div class="pr"><div class="grow"><div class="small">${fmtDateY(w.end)}</div><div class="tiny muted">${ex.sets.map(s=>(s.w!=null&&s.w!==''?s.w+'×':'')+s.r+(s.type!=='N'?s.type.toLowerCase():'')).join('  ')}</div></div></div>`; }).join('')}`:'<p class="muted small">Not logged yet.</p>'}${e.custom?`<button class="btn quiet wide" style="margin-top:12px;color:var(--red)" data-del-cx="${e.id}">Delete custom exercise</button>`:''}`);
  document.getElementById('sheet').addEventListener('click',ev=>{ const d=ev.target.closest('[data-del-cx]'); if(d&&confirm('Delete this exercise?')){ S.customExercises=S.customExercises.filter(x=>x.id!==d.dataset.delCx); save(); closeSheet(); render(); } }); }
function showSummary(w,prs){ const sets=workingSets(w).length; openSheet(`<h2>Workout complete</h2><div class="grid3" style="margin:10px 0"><div class="stat"><div class="lbl">Duration</div><div class="num">${fmtDur(w.end-w.start)}</div></div><div class="stat"><div class="lbl">Sets</div><div class="num">${sets}</div></div><div class="stat"><div class="lbl">Volume</div><div class="num">${fmtK(workoutVolume(w))}</div></div></div>${w.kcal?`<p class="small muted" style="margin-bottom:8px">≈ ${w.kcal} kcal burned (estimate from duration and your bodyweight)</p>`:''}${prs.length?`<h3 style="margin-bottom:4px">New records</h3>${prs.map(p=>`<div class="pr"><span class="pill green">PR</span><div class="grow"><div style="font-weight:600">${esc(exById(p.exId).name)}</div><div class="tiny muted">${p.kind}: ${p.val}</div></div></div>`).join('')}`:'<p class="muted small">No new records this time. Consistency is the record.</p>'}<button class="btn primary wide" style="margin-top:14px" id="sum-close">Done</button>`); document.getElementById('sum-close').onclick=()=>{ closeSheet(); S.tab='home'; save(); render(); }; if(prs.length){ beep(1040,150,.3); setTimeout(()=>beep(1320,250,.3),180); } }
function showWorkout(id){ const w=S.workouts.find(x=>x.id===id); if(!w) return; openSheet(`<h2>${esc(w.name)}</h2><p class="small muted">${fmtDateY(w.end)} · ${w.cardio? cardioSummary(w) : fmtDur(w.end-w.start)+(w.circuit?'':' · '+fmtK(workoutVolume(w))+' '+S.units)}${kcalOf(w)?' · ≈'+kcalOf(w)+' kcal':''}</p>${w.cardio&&w.cardio.note?`<p class="small" style="margin-top:6px">${esc(w.cardio.note)}</p>`:''}${w.exercises.map(ex=>{ const e=exById(ex.exId); return `<div class="pr"><div class="grow"><div style="font-weight:600">${esc(e.name)}</div><div class="tiny muted">${ex.sets.map(s=>(s.w!=null&&s.w!==''?s.w+'×':'')+s.r+(s.type!=='N'?s.type.toLowerCase():'')+(s.rpe?' @'+s.rpe:'')).join('   ')}</div>${ex.note?`<div class="tiny">${esc(ex.note)}</div>`:''}</div></div>`; }).join('')}<div class="grid2" style="margin-top:14px"><button class="btn quiet" id="w-repeat">Repeat this workout</button><button class="btn quiet" id="w-del" style="color:var(--red)">Delete</button></div>`);
  document.getElementById('w-del').onclick=()=>{ if(confirm('Delete this workout from history?')){ S.workouts=S.workouts.filter(x=>x.id!==id); save(); closeSheet(); render(); } };
  document.getElementById('w-repeat').onclick=()=>{ closeSheet(); if(w.imported) return toast('Imported from Health — log a new one from Plans'); if(w.cardio) return cardioLog(w.cardio.type,w.cardio.minutes); if(w.circuit) return toast('Start circuits from the Plans tab'); startWorkout({name:w.name,id:null,exercises:w.exercises.map(ex=>({exId:ex.exId,sets:ex.sets.length,reps:Number(ex.sets[0]&&ex.sets[0].r)||10}))}); }; }
function routineEditor(draft,isNew){ const r=!isNew; const draw=()=>{ const sh=document.getElementById('sheet'); if(!sh) return; sh.querySelector('#re-list').innerHTML=draft.exercises.map((x,i)=>`<li><div class="grow"><div class="t">${esc(exById(x.exId).name)}</div><div class="row" style="margin-top:4px"><input type="number" inputmode="numeric" value="${x.sets}" data-re="sets" data-i="${i}" style="width:64px;min-height:36px;padding:4px"> sets × <input type="number" inputmode="numeric" value="${x.reps}" data-re="reps" data-i="${i}" style="width:64px;min-height:36px;padding:4px"> ${exById(x.exId).kind==='t'?'sec':'reps'}</div></div><button class="btn ghost sm" data-re-up="${i}">↑</button><button class="btn ghost sm" data-re-del="${i}">✕</button></li>`).join('')||'<li class="muted small">No exercises yet.</li>'; };
  openSheet(`<h2>${r?'Edit routine':'New routine'}</h2><div class="stack"><input id="re-name" placeholder="Routine name" value="${esc(draft.name)}"><ul class="list" id="re-list"></ul><button class="btn quiet wide" id="re-add">+ Add exercise</button><div class="grid2"><button class="btn quiet" id="re-cancel">Cancel</button><button class="btn primary" id="re-save">Save routine</button></div>${r?'<button class="btn quiet wide" id="re-del" style="color:var(--red)">Delete routine</button>':''}</div>`); draw();
  const sh=document.getElementById('sheet'); sh.addEventListener('input',e=>{ if(e.target.dataset.re){ draft.exercises[+e.target.dataset.i][e.target.dataset.re]=Number(e.target.value)||1; } if(e.target.id==='re-name') draft.name=e.target.value; });
  sh.addEventListener('click',e=>{ if(e.target.id==='re-add'){ exercisePicker(id=>{ draft.exercises.push({exId:id,sets:3,reps:exById(id).kind==='t'?45:10}); routineEditor(draft,isNew); }); return; } const up=e.target.closest('[data-re-up]'); if(up){ const i=+up.dataset.reUp; if(i>0){ [draft.exercises[i-1],draft.exercises[i]]=[draft.exercises[i],draft.exercises[i-1]]; draw(); } return; } const del=e.target.closest('[data-re-del]'); if(del){ draft.exercises.splice(+del.dataset.reDel,1); draw(); return; } if(e.target.id==='re-cancel'){ closeSheet(); return; } if(e.target.id==='re-del'){ if(confirm('Delete this routine?')){ S.routines=S.routines.filter(x=>x.id!==draft.id); save(); closeSheet(); render(); } return; } if(e.target.id==='re-save'){ if(!draft.name.trim()) return toast('Name the routine'); if(!draft.exercises.length) return toast('Add at least one exercise'); const i=S.routines.findIndex(x=>x.id===draft.id); if(i>=0) S.routines[i]=draft; else S.routines.push(draft); save(); closeSheet(); render(); toast('Routine saved'); } }); }
function bodyForm(){ openSheet(`<h2>Log body stats</h2><div class="stack"><label>Bodyweight (${S.units})<input id="bf-w" type="number" inputmode="decimal" step="any" value="${latestBodyweight()||''}"></label><label>Body fat %<input id="bf-f" type="number" inputmode="decimal" step="any" placeholder="optional"></label><details><summary>Measurements (optional)</summary><div class="grid2" style="margin-top:8px">${['chest','waist','hips','arm','thigh','calf'].map(k=>`<label class="small">${k}<input type="number" inputmode="decimal" step="any" data-m="${k}"></label>`).join('')}</div></details><button class="btn primary wide" id="bf-save">Save</button></div>`);
  document.getElementById('bf-save').onclick=()=>{ const sh=document.getElementById('sheet'); const w=Number(sh.querySelector('#bf-w').value)||null, f=Number(sh.querySelector('#bf-f').value)||null; const m={}; sh.querySelectorAll('[data-m]').forEach(i=>{ if(i.value) m[i.dataset.m]=Number(i.value); }); if(!w&&!f&&!Object.keys(m).length) return toast('Enter something'); S.body.push({id:uid(),date:now(),weight:w,fat:f,m}); if(w) S.bodyweight=w; save(); closeSheet(); render(); toast('Logged'); }; }
function plateCalc(){ const draw=(target)=>{ const bar=Number(S.barWeight)||45; const per=(target-bar)/2; const plates=[...S.plates].sort((a,b)=>b-a); const out=[]; let rem=per; plates.forEach(p=>{ while(rem>=p-1e-9){ out.push(p); rem-=p; } }); const colors={45:'#D7263D',25:'#2BA84A',35:'#F2C230',10:'#2E5BFF',5:'#1C2230',2.5:'#6B7280',20:'#2E5BFF',15:'#F2C230'}; return per<0?'<p class="muted small">Target is lighter than the bar.</p>':`<div class="plates">${out.map(p=>`<div class="plate" style="height:${Math.min(70,20+p)}px;background:${colors[p]||'#5B6472'}">${p}</div>`).join('')||'<span class="muted small">Empty bar</span>'}</div><p><strong>Per side:</strong> ${out.join(' + ')||'nothing'}${rem>0.01?` <span class="muted">(${round(rem,2)} ${S.units} short — add smaller plates in settings)</span>`:''}</p>`; };
  openSheet(`<h2>Plate calculator</h2><div class="stack"><label>Target weight (${S.units}, bar = ${S.barWeight})<input id="pc-t" type="number" inputmode="decimal" step="any" value="135"></label><div id="pc-out"></div><label class="small">Available plates (comma-separated)<input id="pc-plates" value="${S.plates.join(', ')}"></label></div>`);
  const sh=document.getElementById('sheet'); const upd=()=>{ sh.querySelector('#pc-out').innerHTML=draw(Number(sh.querySelector('#pc-t').value)||0); }; sh.querySelector('#pc-t').addEventListener('input',upd); sh.querySelector('#pc-plates').addEventListener('change',e=>{ S.plates=e.target.value.split(',').map(x=>Number(x.trim())).filter(x=>x>0); save(); upd(); }); upd(); }
function warmupCalc(){ openSheet(`<h2>Warm-up calculator</h2><div class="stack"><label>Working weight (${S.units})<input id="wu-w" type="number" inputmode="decimal" step="any" value="225"></label><div id="wu-out"></div></div>`); const sh=document.getElementById('sheet'); const upd=()=>{ const w=Number(sh.querySelector('#wu-w').value)||0; const bar=Number(S.barWeight)||45; const steps=[[0,10,'Empty bar'],[.4,8,''],[.6,5,''],[.75,3,''],[.9,1,'']]; const inc=S.units==='kg'?2.5:5; sh.querySelector('#wu-out').innerHTML=`<table class="sets"><thead><tr><th>Set</th><th>${S.units}</th><th>Reps</th></tr></thead><tbody>${steps.map(([p,r,l],i)=>{ const wt=i===0?bar:Math.max(bar,Math.round(w*p/inc)*inc); return `<tr><td>${i+1}</td><td class="num">${wt}</td><td>${r}${l?' <span class="tiny muted">'+l+'</span>':''}</td></tr>`; }).join('')}<tr><td>Work</td><td class="num">${w}</td><td>—</td></tr></tbody></table>`; }; sh.querySelector('#wu-w').addEventListener('input',upd); upd(); }
function ormCalc(){ openSheet(`<h2>1RM calculator</h2><div class="stack"><div class="grid2"><label>Weight<input id="rm-w" type="number" inputmode="decimal" step="any" value="185"></label><label>Reps<input id="rm-r" type="number" inputmode="numeric" value="5"></label></div><div id="rm-out"></div></div>`); const sh=document.getElementById('sheet'); const upd=()=>{ const w=Number(sh.querySelector('#rm-w').value)||0,r=Number(sh.querySelector('#rm-r').value)||1; const m=e1rm(w,r); sh.querySelector('#rm-out').innerHTML=`<div class="stat" style="text-align:center"><div class="lbl">Estimated 1RM</div><div class="big-num">${Math.round(m)}</div><div class="tiny muted">${S.units} (Epley)</div></div><table class="sets" style="margin-top:8px"><thead><tr><th>%</th><th>${S.units}</th><th>≈ reps</th></tr></thead><tbody>${[95,90,85,80,75,70,65].map(p=>`<tr><td>${p}%</td><td class="num">${Math.round(m*p/100)}</td><td>${Math.round((100/p-1)*30)||1}</td></tr>`).join('')}</tbody></table>`; }; sh.addEventListener('input',upd); upd(); }
function exerciseMenu(i){ const ex=S.active.exercises[i]; openSheet(`<h2>${esc(exById(ex.exId).name)}</h2><div class="stack"><label>Rest timer (sec)<input id="em-rest" type="number" inputmode="numeric" value="${ex.rest}"></label><label>Note<input id="em-note" value="${esc(ex.note)}" placeholder="e.g. pause at bottom"></label><button class="btn quiet wide" id="em-super">${ex.superset?'Remove superset link':'Superset with next exercise'}</button><button class="btn quiet wide" id="em-stats">Stats & history</button><button class="btn quiet wide" id="em-replace">Replace exercise</button><button class="btn quiet wide" id="em-remove" style="color:var(--red)">Remove from workout</button></div>`);
  const sh=document.getElementById('sheet'); sh.querySelector('#em-rest').addEventListener('change',e=>{ ex.rest=Number(e.target.value)||S.restDefault; save(); }); sh.querySelector('#em-note').addEventListener('change',e=>{ ex.note=e.target.value; save(); });
  sh.querySelector('#em-super').onclick=()=>{ ex.superset=!ex.superset; save(); closeSheet(); render(); }; sh.querySelector('#em-stats').onclick=()=>showExerciseStats(ex.exId); sh.querySelector('#em-remove').onclick=()=>{ S.active.exercises.splice(i,1); save(); closeSheet(); render(); }; sh.querySelector('#em-replace').onclick=()=>exercisePicker(id=>{ ex.exId=id; ex.sets.forEach(s=>{s.done=false;}); save(); closeSheet(); render(); }); }

/* ---------- Export / import ---------- */
function download(name,text,type='application/json'){ const b=new Blob([text],{type}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
function exportFoodCSV(){ const rows=[['date','meal','food','brand','amount','kcal','protein_g','carbs_g','fat_g','sugar_g','fiber_g']]; [...foodState().entries].sort((a,b)=>a.date<b.date?-1:1).forEach(e=>rows.push([e.date,e.meal,e.name,e.brand||'',e.qtyLabel||'',e.kcal,e.p,e.c,e.f,e.sugar,e.fiber])); download('ironlog-food-'+new Date().toISOString().slice(0,10)+'.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv'); }
function exportCSV(){ const rows=[['date','workout','exercise','set','type','weight','reps','rpe']]; S.workouts.filter(w=>w.end).forEach(w=>w.exercises.forEach(ex=>ex.sets.forEach((s,i)=>rows.push([new Date(w.end).toISOString(),w.name,exById(ex.exId).name,i+1,s.type,s.w??'',s.r??'',s.rpe??''])))); download('ironlog-'+new Date().toISOString().slice(0,10)+'.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv'); }

/* ---------- Events ---------- */
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; S.tab=b.dataset.tab; save(); render(); });
document.body.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act; unlockAudio();
  switch(act){
    case 'tab': S.tab=el.dataset.tab; save(); render(); break;
    case 'generate': { const focus=document.getElementById('gen-focus').value, min=Number(document.getElementById('gen-min').value); const g=generateWorkout({focus,minutes:min}); if(!g.exercises.length) return toast('No exercises match your equipment — check Settings'); startWorkout({name:g.name,id:null,exercises:g.exercises}); toast('Workout built from your recovery map'); break; }
    case 'start-empty': startWorkout(null); break;
    case 'routine-start': { const r=allRoutines().find(x=>x.id===el.dataset.id); if(r) startWorkout(r); break; }
    case 'routine-edit': { const r=S.routines.find(x=>x.id===el.dataset.id); if(r) routineEditor(JSON.parse(JSON.stringify(r)),false); break; }
    case 'new-routine': routineEditor({id:'u_'+uid(),name:'',exercises:[]},true); break;
    case 'circuit-start': { const c=CIRCUITS.find(x=>x.id===el.dataset.id); if(c) startCircuit(c); break; }
    case 'plan-build': planBuilder(); break;
    case 'plan-start-today': startTodaysPlan(); break;
    case 'cardio-log': cardioLog(el.dataset.id); break;
    case 'circuit-pause': if(circ){ circ.paused=!circ.paused; renderCircuit(); } break;
    case 'circuit-skip': if(circ){ circ.left=1; } break;
    case 'circuit-quit': if(circ&&confirm('Quit this circuit? It will not be logged.')){ clearInterval(circ.timer); circ=null; document.getElementById('circuit').remove(); } break;
    case 'circuit-close': { const c=document.getElementById('circuit'); if(c) c.remove(); render(); break; }
    case 'add-exercise': exercisePicker(id=>{ addExerciseToActive(id); closeSheet(); }); break;
    case 'add-set': { const ex=S.active.exercises[+el.dataset.ex]; const l=ex.sets[ex.sets.length-1]; ex.sets.push({w:l?l.w:'',r:l?l.r:10,type:'N',rpe:'',done:false}); save(); render(); break; }
    case 'settype': { const s=S.active.exercises[+el.dataset.ex].sets[+el.dataset.set]; s.type={N:'W',W:'D',D:'F',F:'N'}[s.type]; save(); render(); break; }
    case 'done': { const ex=S.active.exercises[+el.dataset.ex]; const s=ex.sets[+el.dataset.set]; s.done=!s.done; if(s.done){ const e=exById(ex.exId); if(e.kind!=='t'&&e.kind!=='d'&&(s.r===''||s.r==null)) { s.done=false; toast('Enter reps first'); break; } vibrate(30); if(ex.rest>0&&!ex.superset) startRest(ex.rest); } save(); render(); break; }
    case 'ex-menu': exerciseMenu(+el.dataset.ex); break;
    case 'finish': finishWorkout(); break;
    case 'discard': if(confirm('Discard this workout?')){ S.active=null; stopRest(); save(); render(); } break;
    case 'rest-add': rest.end+=30000; rest.total+=30; S._rest={end:rest.end,total:rest.total}; save(); tickRest(); break;
    case 'rest-skip': stopRest(); break;
    case 'open-workout': showWorkout(el.dataset.id); break;
    case 'body-add': bodyForm(); break;
    case 'body-del': if(confirm('Delete this entry?')){ S.body=S.body.filter(b=>b.id!==el.dataset.id); save(); render(); } break;
    case 'library': exercisePicker(id=>showExerciseStats(id),{title:'Exercise library',history:true}); break;
    case 'calc-plates': plateCalc(); break;
    case 'calc-warmup': warmupCalc(); break;
    case 'calc-1rm': ormCalc(); break;
    case 'health-import': healthSheet(); break;
    case 'health-clip': importFromClipboard(); break;
    case 'food-add': foodSearchSheet(el.dataset.meal||null); break;
    case 'food-edit': editFoodEntry(el.dataset.id); break;
    case 'food-day': { const f=foodState(); const d=new Date(foodDay()+'T12:00:00'); d.setDate(d.getDate()+Number(el.dataset.d)); const k=localDay(d); f.day= k>=todayKey()? null : k; save(); render(); break; }
    case 'food-targets': targetsSheet(); break;
    case 'eq': { const q=el.dataset.eq; S.equipment=S.equipment.includes(q)? S.equipment.filter(x=>x!==q) : S.equipment.concat(q); save(); el.classList.toggle('on'); break; }
    case 'export-json': { const o=Object.assign({},S); delete o._rest; delete o._pendingImport; delete o._chartEx; o.exportedFrom='Ironlog v'+APP_VERSION; download('ironlog-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(o,null,1)); toast('Backup downloaded'); break; }
    case 'export-csv': exportCSV(); break;
    case 'export-food-csv': exportFoodCSV(); break;
    case 'import-json': document.getElementById('import-file').click(); break;
    case 'wipe': if(confirm('Erase ALL workouts, routines and settings on this device?')&&confirm('Really erase everything? Export a backup first if unsure.')){ localStorage.removeItem(KEY); S=load(); render(); toast('Erased'); } break;
  } });
document.body.addEventListener('change',e=>{ const t=e.target;
  if(t.dataset.f&&S.active){ const s=S.active.exercises[+t.dataset.ex].sets[+t.dataset.set]; s[t.dataset.f]= t.value===''? '' : Number(t.value); save(); return; }
  if(t.id==='chart-ex'){ S._chartEx=t.value; render(); return; }
  if(t.id==='set-units'){ S.units=t.value; S.barWeight= t.value==='kg'?20:45; S.plates= t.value==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5]; save(); render(); return; }
  if(t.id==='set-bw'){ S.bodyweight=Number(t.value)||null; save(); render(); return; }
  if(t.id==='pf-sex'){ S.profile.sex=t.value; save(); render(); return; }
  if(t.id==='pf-age'){ S.profile.age=Number(t.value)||null; save(); render(); return; }
  if(t.id==='pf-height'){ S.profile.height=Number(t.value)||null; save(); render(); return; }
  if(t.dataset.planDay!=null&&S.plan){ const wd=+t.dataset.planDay; const v=t.value; S.plan.days=S.plan.days.filter(d=>d.weekday!==wd); if(v){ const d={weekday:wd,routineId:null,cardio:null,cardioMin:0}; if(v.startsWith('cardio:')){ d.cardio=v.slice(7); d.cardioMin=30; } else d.routineId=v; S.plan.days.push(d); S.plan.days.sort((a,b)=>a.weekday-b.weekday); } save(); render(); return; }
  if(t.id==='set-bar'){ S.barWeight=Number(t.value)||45; save(); return; }
  if(t.id==='set-rest'){ S.restDefault=Number(t.value)||90; save(); return; }
  if(t.id==='set-goal'){ S.goal=t.value; save(); return; }
  if(t.id==='set-theme'){ S.theme=t.value; applyTheme(); save(); return; }
  if(t.id==='import-file'){ const f=t.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o||!Array.isArray(o.workouts)) throw 0; if(confirm(`Import ${o.workouts.length} workouts? This replaces the data on this device.`)){ S=Object.assign({},DEFAULTS,o); S.active=null; save(); applyTheme(); render(); toast('Imported'); } }catch(err){ toast('That file is not an Ironlog backup'); } }; rd.readAsText(f); t.value=''; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
function applyTheme(){ document.documentElement.dataset.theme= S.theme==='auto'?'':S.theme; }
if(S.food) S.food.day=null; applyTheme(); render(); startTick(); resumeRest(); handleImportParam(); checkBirthdayUnlock(); setTimeout(maybeAskHealth,600);
if(S.active) { /* resume rest display only if a timer was live is not persisted; fine */ }
</script>
